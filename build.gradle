plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "JEI"
        url 'https://maven.blamejared.com'
    }
    flatDir {
        dir 'libs'
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://mvn.devos.one/snapshots" // Registrate
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users starting in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// waiting in ports
sourceSets.main.java {
    exclude 'cy/jdkdigital/productivefarming/integrations/botanypots/**'
    exclude 'cy/jdkdigital/productivefarming/integrations/ponder/**'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "local.libs:productivelib-${lib_version}"
    jarJar(group: 'cy.jdkdigital.productivelib', name: 'productivelib', version: "${lib_version_range}") {
        transitive(false)
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // productivebees: local 26.1 build in libs/ (compile + dev-runtime for the optional integration).
    compileOnly "local.libs:productivebees-${pb_version}"
    localRuntime "local.libs:productivebees-${pb_version}"
    // productivebees' own hard dep — needed at dev-runtime so its entities/recipes initialize.
    localRuntime "curse.maven:geckolib-388172:7913641"

    // Mod-compat dependencies — file IDs must be resolved against MC 26.1.2 on CurseForge before
    // restoring the matching integrations/** sources. Commented until each publishes a 26.1.2 build.
    implementation "curse.maven:jade-324717:8068368"  // Jade-mc26.1-NeoForge-26.1.1 (supports 26.1.2)

    implementation "curse.maven:agritech-1485550:8241714"  // agritechtwo-1.2.0+neoforge-mc-26.1.2
    implementation "curse.maven:agritech-evolved-1287394:8241737"  // agritechevolved-2.1.0+neoforge-mc26.1.2

    // Mystical Agriculture (+ its hard dep Cucumber) — dev-runtime only.
    localRuntime "curse.maven:mystical-agriculture-246640:8130326"  // MysticalAgriculture-26.1.2-9.0.3
    localRuntime "curse.maven:cucumber-272335:8178456"              // Cucumber-26.1.2-9.0.3

    // Croptopia (+ its hard dep EpheroLib) — dev-runtime only.
    localRuntime "curse.maven:croptopia-415438:8085081"  // croptopia-neoforge-26.1.2-4.3.1
    localRuntime "curse.maven:epherolib-885449:7937982"  // epherolib-neoforge-26.1-1.3.0

    // Silent Gear (+ its hard dep Silent Lib) — dev-runtime only.
    localRuntime "curse.maven:silent-gear-297039:8089163"  // silent-gear 4.2.1 for NeoForge 26.1.2
    localRuntime "curse.maven:silent-lib-242998:7936002"   // silent-lib 11.2.0 for NeoForge 26.1.x

    // FTB Ultimine (+ its deps Architectury API and FTB Library) — dev-runtime only.
    localRuntime "curse.maven:ftb-ultimine-forge-386134:8154089"  // FTB Ultimine NeoForge 26.1.2.4
    localRuntime "curse.maven:architectury-api-419699:8196569"    // Architectury API 20.0.5 (NeoForge 26.1.2)
    localRuntime "curse.maven:ftb-library-forge-404465:8160272"   // FTB Library NeoForge 26.1.2.6
//    implementation "curse.maven:dyenamics-509276:6620953"
//    implementation "curse.maven:utilitarian-929559:6650737"
//    implementation "curse.maven:farming-for-blockheads-261924:6409932"
//    implementation "curse.maven:balm-531761:6841890"
//    implementation "curse.maven:botany-pots-353928:6895762"
//    implementation "curse.maven:prickle-1023259:6546240"
//    implementation "curse.maven:bookshelf-228525:6717571"
//    implementation "curse.maven:ftb-library-forge-404465:6874538"
//    implementation "curse.maven:architectury-api-419699:5786327"
//    implementation "curse.maven:immersive-engineering-231951:6733669"
    // no 26.1.2 — Create / ponder / flywheel / registrate integration excluded
//    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
//    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
//    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            lib_version            : lib_version,
            lib_version_range      : lib_version_range,
            pb_version             : pb_version,
            pb_version_range       : pb_version_range,
            jei_version            : jei_version,
            agritech_version_range : agritech_version_range,
            agritech_evolved_version_range: agritech_evolved_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
